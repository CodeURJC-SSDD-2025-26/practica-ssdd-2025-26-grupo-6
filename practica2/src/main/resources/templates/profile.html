<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Perfil</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!--Chart.js Librarie-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary principal pageProfile">

    <!-- HEADER -->
    {{>header}}

    <!-- Page Content -->
    <div class="content">
        <!-- Profile Buttons -->
        <div class="d-flex justify-content-start gap-3 p-3">
            {{#isAdmin}}
            <a href="administrator" class="profile-btn text-decoration-none">
                Administrador
            </a>
            {{/isAdmin}}
            <a href="myLists" class="profile-btn text-decoration-none">
                Mis Listas
            </a>
            <a href="myReviews" class="profile-btn text-decoration-none">
                Mis Reseñas
            </a>
        </div>

        <!-- Profile Information -->
        <div class="row align-items-center justify-content-center">
            <div class="col-12 col-lg-7">
                <div class="card p-4 generic-card rounded-4 border-0 mb-5">
                    <h1 class="h3 mb-4 text-center text-white">Mi Perfil</h1>
                    <div class="text-center mb-4">
                        <button type="button" class="btn p-0 border-0" data-bs-toggle="modal"
                            data-bs-target="#modalAvatar">
                            <img id="avatarProfile" src="{{currentUser.accountAvatar}}" class="rounded-circle"
                                width="175" height="175">
                        </button>
                    </div>
                    <div class="mb-3 text-center">
                        <label class="small text-uppercase opacity-50 mb-1">Usuario</label>
                        <div class="profile-field rounded-3 py-3 px-4 mb-4 d-flex align-items-center justify-content-center fs-5"
                            id="username">
                            {{currentUser.accountName}}
                        </div>
                    </div>
                    <div class="mb-3 text-center">
                        <label class="small text-uppercase opacity-50 mb-1">Correo electrónico</label>
                        <div class="profile-field rounded-3 py-3 px-4 mb-4 d-flex align-items-center justify-content-center fs-5"
                            id="email">
                            {{currentUser.accountEmail}}
                        </div>
                    </div>
                    <div class="mb-3 text-center">
                        <label class="small text-uppercase opacity-50 mb-1">Fecha de nacimiento</label>
                        <div class="profile-field rounded-3 py-3 px-4 mb-4 d-flex align-items-center justify-content-center fs-5"
                            id="yearBirth">
                            {{currentUser.accountBirthDate}}
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" id="editProfileBtn" class="btn btn-primary">Editar Perfil</button>
                    </div>
                </div>
            </div>
            <div class="col-10 col-lg-5 pe-lg-5 mb-5">
                <canvas id="myReviewsBarUser"></canvas>
            </div>
        </div>
    </div>

    <!-- Footer -->
    {{>footer}}

    <!-- Avatar Modal -->
    <div class="modal fade" id="modalAvatar" tabindex="-1" aria-labelledby="modalAvatarLabel">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalAvatarTitleLabel">¿Qué Avatar quieres ser?</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <div class="text-center mb-4">
                            <p>Seleccionado actualmente:</p>
                            <img src="{{currentUser.accountAvatar}}" id="previewAvatar"
                                class="rounded-circle border border-primary border-3" width="100" height="100">
                        </div>
                        <div class="row g-3 justify-content-center" id="avatarGallery">
                            <div class="col-4 text-center">
                                <img src="images/perfilNoReg.jpg"
                                    class="img-thumbnail rounded-circle img-selectable active-avatar" role="button"
                                    data-value="images/perfilNoReg.jpg">
                            </div>
                            <div class="col-4 text-center">
                                <img src="images/Palomix.jpg"
                                    class="img-thumbnail rounded-circle img-selectable active-avatar" role="button"
                                    data-value="images/Palomix.jpg">
                            </div>
                            <div class="col-4 text-center">
                                <img src="images/filmix1.jpg"
                                    class="img-thumbnail rounded-circle img-selectable active-avatar" role="button"
                                    data-value="images/filmix1.jpg">
                            </div>
                            <div class="col-4 text-center">
                                <img src="images/filmixGafas1.jpg"
                                    class="img-thumbnail rounded-circle img-selectable active-avatar" role="button"
                                    data-value="images/filmixGafas1.jpg">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <form id="avatarForm" action="/profile/avatar" method="post">

                        <input type="hidden" id="avatarInput" name="avatarSrc" value="{{currentUser.accountAvatar}}">
                        <button type="button" class="btn btn-secondary btn-small"
                            data-bs-dismiss="modal">Cerrar</button>
                        <button type="button" id="saveAvatar" class="btn btn-primary btn-small"
                            data-bs-dismiss="modal">Guardar
                            Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="js/avatar.js"></script>
    <script src="js/profileForms.js"></script>
    <script src="js/userRatingBarChart.js" defer></script>

</body>

</html>
