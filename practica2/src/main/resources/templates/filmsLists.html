<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Lista de Películas</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Our CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="primary principal">
    <!-- HEADER -->
    {{>header}}


    <!-- Page Content -->
    <div class="content px-5">
        <!-- Título + botón volver -->
        <div class="d-flex justify-content-between align-items-center py-3">
            <h4 class="mb-0">{{listName}}</h4>
            <a href="/lists" class="btn btn-secondary">Volver</a>
        </div>

        <!-- Grid de películas -->
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-4">

            {{#filmographyList}}
            <div class="col">
                <div class="card film-list">
                    <a href="/filmographies/{{filmographyId}}" class="text-decoration-none text-dark">
                        <img src="{{filmographyImageUrl}}" class="card-img-top" alt="{{filmographyName}}">
                    </a>
                </div>
            </div>
            {{/filmographyList}}

            {{^filmographyList}}
            <div class="col-12 text-center py-5">
                <p class="text-light">Esta lista está vacía</p>
            </div>
            {{/filmographyList}}
        </div>
    </div>

    <!-- Footer -->
    {{>footer}}


    <!-- Scripts -->
    <script src="js/reviews.js"></script>
</body>

</html>
