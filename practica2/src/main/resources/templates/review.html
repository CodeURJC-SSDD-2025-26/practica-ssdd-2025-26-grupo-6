<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Reseñas</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary principal" id="page-reviews">

    <!-- HEADER -->
    {{>header}}

    <!-- Page Content -->
    <div class="content px-5">
        <div class="d-flex justify-content-between  pb-3">
            <h4>Reseñas de {{filmography.filmographyName}}</h4>
            <a href="movieDetails" class="btn btn-secondary">Volver</a>
        </div>

    <div class="row row-cols-1 row-cols-md-2 g-5">

        {{#reviews}}
        <div class="col">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title m-0">{{reviewAuthorName}}</h5>
                        <div class="rating d-flex align-items-center">
                            <h4 class="punctuation m-0 me-1">{{reviewStars}}</h4>
                            <i class="bi bi-star-fill fs-4 text-warning"></i>
                        </div>
                    </div>

                    <p class="card-text mt-3">{{reviewDescription}}</p>

                    <hr class="m-0 mt-auto">
                    <div class="d-flex justify-content-end">
                        <div class="card-footer bg-transparent py-1 border-0">
                            <a class="btn btn-primary btn-sm" data-bs-toggle="modal"
                                data-bs-target="#modalReview{{reviewId}}">
                                Ver más
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal -->
            <div class="modal fade" id="modalReview{{reviewId}}" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content">
                        <div class="card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h5 class="card-title m-0">{{reviewAuthorName}}</h5>
                                    <div class="rating d-flex align-item-center">
                                        <h4 class="punctuation m-0 me-1">{{reviewStars}}</h4>
                                        <i class="bi bi-star-fill fs-4 text-warning"></i>
                                    </div>
                                </div>

                                <p class="card-text mt-3">{{reviewDescription}}</p>

                                <hr class="m-2">
                                <div class="d-flex justify-content-end">
                                    <button class="btn btn-secondary btn-small" data-bs-dismiss="modal">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        {{/reviews}}

        {{^reviews}}
        <p class="text-light small">No hay reseñas para esta película.</p>
        {{/reviews}}

    </div>

    </div>


    <!-- Footer -->
    {{>footer}}
</body>

</html>
