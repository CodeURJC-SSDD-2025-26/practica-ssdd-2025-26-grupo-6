<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Iniciar Sesión</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary">
    <!-- Page Content -->
    <div class="row p-5 d-flex align-items-center">
        <!-- Logo -->
        <div class="col-md-6 text-center">
            <img class="mb-2 img-fluid" src="images/logo.png" alt="Logo Palomix" width="80%" height="90%" />
        </div>

        <!-- Form -->
        <div class="col mt-5 d-flex justify-content-center">
            <div class="container-login">
                <h1 class="mb-3 text-center text-light">Iniciar Sesión</h1>
                <form>
                    <div class="form-floating mb-3" id="fEmail">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
                        <label for="floatingInput" class="text-dark">Correo Electrónico</label>
                    </div>
                    <div class="form-floating mb-3" id="fPass">
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                        <label for="floatingPassword" class="text-dark">Contraseña</label>
                    </div>
                    <div class="container">
                        <div class="row my-3">
                            <div class="col">
                                <div class="form-check text-start">
                                    <input class="form-check-input" type="checkbox" value="remember-me"
                                        id="checkDefault">
                                    <label class="form-check-label text-light" for="checkDefault">Recordarme</label>
                                </div>
                            </div>
                            <div class="col offset-sm-3">
                                <a class="btn-invisible text-decoration-underline bg-none" type="button" id="resetPass"
                                    data-bs-toggle="modal" data-bs-target="#modalRecuperar">
                                    <h6>Me olvidé la contraseña</h6>
                                </a>
                            </div>
                        </div>
                        <div class="row my-3">
                            <div class="col">
                                <a href="signUp.html">
                                    <h6>Crear Cuenta</h6>
                                </a>
                            </div>
                            <div class="col offset-sm-3">
                                <a href="principal.html">
                                    <h6> No quiero iniciar sesión</h6>
                                </a>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 py-2" id="loginButton" type="button">Acceder</button>
                </form>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal" tabindex="-1" id="modalRecuperar">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Reiniciar Contraseña</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Introduce tu correo electrónico para enviar el código de recuperación.</p>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com"
                                required />
                            <label for="floatingInput" class="text-dark">Correo Electrónico</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary">Enviar correo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    {{>footer}}

    <!-- Scripts -->
    <script src="js/searchFunc.js"></script>
    <script src="js/signUpLogin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
