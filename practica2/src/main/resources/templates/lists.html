<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Listas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary principal" id="page-listas">

    <!-- HEADER -->
    {{>header}}

    <div class="content">

        {{#sections}}
        <div style="margin-top: 30px;">
            <div class="d-flex justify-content-start align-items-center gap-3 mb-3 view-more">
                <h4>{{sectionTitle}}</h4>
            </div>
            <div class="films">
                {{#lists}}
                <div class="card">
                    <a href="/lists/{{listsId}}">
                        <img src="{{firstImage}}" alt="{{listName}}">
                        <h5>{{listName}}</h5>
                        <p>{{size}} elementos</p>
                    </a>
                </div>
                {{/lists}}
            </div>
        </div>
        {{/sections}}

    </div>

    <!-- FOOTER -->
    {{>footer}}

</body>

</html>
