{{>head}}

            <div class="row align-items-center justify-content-center">
                <div class="col-8 col-sm-6 col-md-4 col-lg-3">
                    <img class="img-fluid" src="/images/searchError.png" alt="Imagen Error">
                </div>
                <div class="col-12 col-sm-auto text-center text-md-start mt-3 mt-sm-0">
                    <h1 class="m-0">Error 400 : {{error}}</h1>

                </div>
            </div>
        </div>
            <a href="/principal" class="btn btn-primary p-2 px-4 text-decoration-none" style="width: auto;">Volver al Inicio</a>
    </div>
    
    {{>footer}}

</html>
