<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Crear Cuenta</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary">
    <!-- Page Content-->
    <div class="row p-5 d-flex align-items-center">
        <div class="col-md-6 text-center">
            <img class="mb-2 img-fluid" src="images/logo.png" alt="Logo Palomix" width="80%" height="90%" />
        </div>
        <div class="col mt-5 d-flex justify-content-center">
            <div class="container-login">
                <h1 class="text-center text-light pb-4">Crear Cuenta</h1>
                <form >
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" />
                        <label for="floatingInput" class="text-dark">Correo Electrónico</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="user" placeholder="user123" data-bs-toggle="popover"
                            data-bs-title="Formato de Usuario" data-bs-trigger="focus"
                            data-bs-content="Debe tener entre 5 y 12 caracteres, sin espacios." />
                        <label for="floatingInput" class="text-dark">Nombre de Usuario</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" placeholder="Password">
                        <label for="floatingPassword" class="text-dark">Contraseña</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password2" placeholder="Password">
                        <label for="floatingPassword" class="text-dark">Repite la Contraseña</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="date" class="form-control" id="birthDate" placeholder="DD/MM/YYYY" />
                        <label for="floatingInput" class="text-dark">Año de Nacimiento</label>
                    </div>
                    <div class="row">
                        <div class="col">
                            <button class="btn btn-primary w-100 py-2" type="button" id="signUpBtn">Crear
                                Cuenta</button>
                        </div>
                        <div class="col">
                            <button class="btn btn-danger w-100 py-2" type="button" id="cancelBtn">Cancelar</button>
                        </div>
                    </div>
                </form>
              </div>
        </div>
    </div>

    <!-- Footer -->
    {{>footer}}

    <!-- Scripts -->
    <script src="js/signUpLogin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
