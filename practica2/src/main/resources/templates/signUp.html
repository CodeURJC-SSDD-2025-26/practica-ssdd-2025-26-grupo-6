<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Crear Cuenta</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary">
    <!-- Page Content-->
    <div class="row p-5 d-flex align-items-center">
        <div class="col-md-6 text-center">
            <img class="mb-2 img-fluid" src="images/logo.png" alt="Logo Palomix" width="80%" height="90%" />
        </div>
        <div class="col mt-5 d-flex justify-content-center">
            <div class="container-login">
                <h1 class="text-center text-light pb-4">Crear Cuenta</h1>
                <form action="/signUp" method="post">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" name="email" required />
                        <label for="email" class="text-dark">Correo Electrónico</label>
                    </div>
                    {{#errorE}}<div class="alert alert-danger p-2">{{errorE}}</div>{{/errorE}}

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" name="name" required />
                        <label for="user" class="text-dark">Nombre de Usuario</label>
                    </div>
                    {{#errorN}}<div class="alert alert-danger p-2">{{errorN}}</div>{{/errorN}}

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" name="password" required />
                        <label for="user" class="text-dark">Contraseña</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" name="confirmPassword" required />
                        <label for="user" class="text-dark">Repetir Contraseña</label>
                    </div>
                    {{#errorP}}<div class="alert alert-danger p-2">{{errorP}}</div>{{/errorP}}

                    <div class="form-floating mb-3">
                        <input type="date" class="form-control" id="birthDate" name="birthDate" placeholder="dd-mm-aaaa" title="Formato requerido: dd-mm-aaaa" required />
                        <label for="birthDate" class="text-dark">Fecha de Nacimiento (dd-mm-aaaa)</label>
                    </div>
                    {{#errorD}}<div class="alert alert-danger p-2">{{errorD}}</div>{{/errorD}}

                    <div class="form-check text-start">
                        <input class="form-check-input" type="checkbox" id="checkDefault" name="role">
                        <label class="form-check-label text-light" for="checkDefault">Admin?</label>
                    </div>


                    <div class="row">
                        <div class="col">
                            <button class="btn btn-primary w-100 py-2" type="submit">Crear Cuenta</button>
                        </div>
                        <div class="col">
                            <a href="/login" class="btn btn-danger w-100 py-2">Cancelar</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    {{>footer}}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
