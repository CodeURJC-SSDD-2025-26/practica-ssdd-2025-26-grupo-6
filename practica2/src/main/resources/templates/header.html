<!-- Navbar -->
<div class="header">
    <div class="row align-items-center px-5">
        <div class="col-auto d-none d-lg-block">
            <a class="navbar-brand" href="/principal">
                <img src="/images/logo.png" alt="logo" height="100vh" width="100vw">
            </a>
        </div>
        <nav class="col navbar navbar-expand-lg">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <a class="navbar-brand d-lg-none" href="/principal">
                    <img src="/images/logo.png" alt="logo" height="100vh" width="100vw">
                </a>
                <button class="navbar-toggler border-0 bg-white p-1" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <i class="bi bi-list fs-1"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav gap-4 me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/principal">
                                <h5>Peliculas</h5>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/series">
                                <h5>Series</h5>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/lists">
                                <h5>Listas</h5>
                            </a>
                        </li>
                    </ul>
                    <div class="d-flex flex-column flex-lg-row gap-3 align-items-center">
                        <div class="search">
                            <form class="input-group" action="/searchBar" method="get">
                                <button class="btn btn-outline-primary" type="submit" id="searchBtn">
                                    <i class="bi bi-search"></i>
                                </button>
                                <input type="text" class="form-control" placeholder="Buscar" name="search">
                            </form>
                        </div>

                        <div class="col-1 profile dropdown text-end">
                            <button class="btn btn-secondary dropdown-toggle border-0 bg-transparent" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <img id="avatarLogo" 
                                src="{{#currentUser}}{{currentUser.accountAvatar}}{{/currentUser}}
                                {{^currentUser}}/images/perfilNoReg.jpg{{/currentUser}}"
                                class="rounded-circle" width="50" height="50">
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="/profile">Mi Perfil</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                {{#isLoggedIn}}
                                <li>
                                    <form action="/logout" method="post" class="p-0 m-0">
                                        <input type="hidden" name="_csrf" value="{{_csrf.token}}">
                                        <button type="submit" class="btn btn-link text-danger dropdown-item">
                                            Cerrar Sesión
                                        </button>
                                    </form>
                                </li>
                                {{/isLoggedIn}}
                                {{^isLoggedIn}}
                                <li>
                                    <a class="dropdown-item text-danger" href="/login">Iniciar Sesión</a>
                                </li>
                                {{/isLoggedIn}}
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</div>
