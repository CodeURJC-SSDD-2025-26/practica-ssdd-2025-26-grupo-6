<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Peliculas</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary principal" id="page-peliculas">
    
    <!-- HEADER -->
    {{>header}}

    <!-- Page Content -->
    <div class="content">
        <div class="mt-4" id="peliculasNuevas"> <!-- First Section -->
            <!-- Section Title-->
            <div class="d-flex justify-content-start align-items-center gap-3 mb-3 view-more">
                <h4>Peliculas recientemente añadidas</h4>
                <a class="btn btn-secondary btn-small" href="filmsLists">Ver más</a>
            </div>
            <!-- Films section-->
            <div class="films"></div>
        </div>
        <div class="mt-3" id="peliculasAcción"> <!-- Second Section -->
            <!-- Section Title-->
            <div class="d-flex justify-content-start align-items-center gap-3 mb-3 view-more">
                <h4>Peliculas de Acción</h4>
                <a class="btn btn-secondary btn-small" href="filmsLists">Ver Más</a>
            </div>
            <!-- Films section-->
            <div class="films"></div>
        </div>
        <div class="mt-3 mb-4" id="peliculasAventura"> <!-- Third Section -->
            <!-- Section Title-->
            <div class="d-flex justify-content-start align-items-center gap-3 mb-3 view-more">
                <h4>Peliculas de Aventura</h4>
                <a class="btn btn-secondary btn-small" href="filmsLists">Ver más</a>
            </div>
            <!-- Films section-->
            <div class="films"></div>
        </div>
    </div>

    <!-- Footer -->
    {{>footer}}
    
    <!-- Scripts -->
    <script src="js/loadMoviesSeriesLists.js"></script>
    >
</body>

</html>
