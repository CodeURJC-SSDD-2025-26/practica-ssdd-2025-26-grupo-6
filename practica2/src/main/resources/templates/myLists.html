<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Mis Listas</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary principal" id="page-listas">

    <!-- HEADER -->
    {{>header}}

    <!-- Page Content-->
    <div class="content">
        <div class="d-flex justify-content-start gap-3 p-3">
            <a href="profile.html" class="profile-btn text-decoration-none">
                Perfil
            </a>
            <a href="administrator.html" class="profile-btn text-decoration-none">
                Administrador
            </a>
            <a href="myReviews.html" class="profile-btn text-decoration-none">
                Mis Reseñas
            </a>
        </div>
        <div class="d-flex justify-content-start gap-3 p-3 add-list mb-0">
            <div class="btn btn-primary rounded btn-small" data-bs-toggle="modal" data-bs-target="#newListModal"
                role="button">
                Añadir Lista
            </div>
        </div>
        <!-- First Section -->
        <div class="mt-4">
            <!-- Section Title-->
            <div class="row align-items-center pb-2">
                <div class="col-auto d-flex align-items-center gap-2">
                    <h4>Me gustan</h4>
                </div>
                <div class="col-auto ms-auto p-3">
                    <button type="button" class="btn btn-sm btn-secondary"><i
                            class="bi bi-trash fs-6"></i></button>
                </div>
            </div>
            <!-- Films section-->
            <div class="films"></div>
        </div>
        <!-- Second Section -->
        <div class="mt-4">
            <!-- Section Title-->
            <div class="row align-items-center pb-2">
                <div class="col-auto d-flex align-items-center gap-2">
                    <h4>Peliculas de Ciencia Ficción</h4>
                </div>
                <div class="col-auto ms-auto p-3">
                    <button type="button" class="btn btn-sm btn-secondary"><i
                            class="bi bi-trash fs-6"></i></button>
                </div>
            </div>
            <!-- Films section-->
            <div class="films"></div>
        </div>
        <!-- Third Section -->
        <div class="mt-4">
            <!-- Section Title-->
            <div class="row align-items-center pb-2">
                <div class="col-auto d-flex align-items-center gap-2">
                    <h4>Peliculas que tengo que ver</h4>
                </div>
                <div class="col-auto ms-auto p-3">
                    <button type="button" class="btn btn-sm btn-secondary"><i
                            class="bi bi-trash fs-6"></i></button>
                </div>  
            </div>
            <!-- Films section-->
            <div class="films">
                <!-- Card Movies-->
            </div>
        </div>

    </div>

    <!-- Footer -->
    {{>footer}}

    <!-- Modal -->
    <div class="modal fade" id="newListModal" tabindex="-1" aria-labelledby="newListLabel">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="newListLabel">Nueva Lista</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="listName" class="for-label fw-semibold">Nombre de la lista</label>
                    <input type="text" class="form-control" id="listName" placeholder="Nombre de la lista...">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-small" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary btn-small" data-bs-dismiss="modal">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/loadMoviesSeriesLists.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
