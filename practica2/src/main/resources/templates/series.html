<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Series</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="primary principal" id="page-series">

    {{>header}}

    <div class="content">

        {{#seriesSections}}
        <div class="genre-section mb-5">
            <div class="d-flex justify-content-start align-items-center gap-3 mb-3 view-more">
                <h4>Series de {{name}}</h4>
                <a class="btn btn-secondary btn-small" href="/series/genre/{{genreKey}}">Ver más</a>
            </div>

            <div class="films">
                {{#series}}
                <div class="card">
                    <a href="/filmographies/{{filmographyId}}">
                        <img src="{{filmographyImageUrl}}" alt="{{filmographyName}}">
                        <h5>{{filmographyName}}</h5>
                    </a>
                </div>
                {{/series}}

                {{^series}}
                <p>No hay series de {{name}} disponibles.</p>
                {{/series}}
            </div>
        </div>
        {{/seriesSections}}

    </div>


    {{>footer}}

</body>

</html>
