components:
  schemas:
    ReviewUpdateRequest:
      type: object
      properties:
        reviewStars:
          type: number
          format: float
        reviewDescription:
          type: string
    ReviewDto:
      type: object
      properties:
        reviewId:
          type: integer
          format: int64
        reviewStars:
          type: number
          format: float
        reviewDescription:
          type: string
        filmographyId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        authorName:
          type: string
    AccountDto:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
        accountName:
          type: string
        accountBirthDate:
          type: string
          format: date
        accountEmail:
          type: string
        accountRole:
          type: string
          enum:
          - USER
          - ADMIN
        avatar:
          $ref: "#/components/schemas/ImageDto"
        listIds:
          type: array
          items:
            type: integer
            format: int64
    ImageDto:
      type: object
      properties:
        imageId:
          type: integer
          format: int64
    AvatarRequest:
      type: object
      properties:
        imageId:
          type: integer
          format: int64
    ListUpdateRequest:
      type: object
      properties:
        newName:
          type: string
        filmographyIds:
          type: array
          items:
            type: integer
            format: int64
    FilmographyBasicDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        averageStars:
          type: number
          format: float
        type:
          type: string
        image:
          $ref: "#/components/schemas/ImageDto"
    ListsDto:
      type: object
      properties:
        listsId:
          type: integer
          format: int64
        listName:
          type: string
        type:
          type: string
          enum:
          - MOVIE
          - SERIE
          - USER
        filmographyList:
          type: array
          items:
            $ref: "#/components/schemas/FilmographyBasicDto"
    GenreDto:
      type: object
      properties:
        genres:
          type: string
          enum:
          - ACCIÓN
          - ANIMACIÓN
          - AVENTURA
          - BÉLICO
          - BIOGRÁFICO
          - CIENCIA_FICCIÓN
          - CINE_NEGRO
          - COMEDIA
          - CRIMEN
          - DEPORTE
          - DOCUMENTAL
          - DRAMA
          - FAMILIAR
          - FANTASÍA
          - HISTORIA
          - INDEPENDIENTE
          - MIEDO
          - MISTERIO
          - MUSICAL
          - OESTE
          - REALITY
          - ROMANCE
          - SUSPENSE
    SerieDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        averageStars:
          type: number
          format: float
        synopsis:
          type: string
        year:
          type: integer
          format: int32
        trailerUrl:
          type: string
        image:
          $ref: "#/components/schemas/ImageDto"
        platforms:
          type: array
          items:
            type: string
            enum:
            - DISNEY
            - NETFLIX
            - PRIMEVIDEO
            - HBOMAX
            - MOVISTARPLUS
        directorName:
          type: string
        duration:
          type: integer
          format: int32
        genres:
          type: array
          items:
            $ref: "#/components/schemas/GenreDto"
    MovieDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        averageStars:
          type: number
          format: float
        synopsis:
          type: string
        year:
          type: integer
          format: int32
        trailerUrl:
          type: string
        image:
          $ref: "#/components/schemas/ImageDto"
        platforms:
          type: array
          items:
            type: string
            enum:
            - DISNEY
            - NETFLIX
            - PRIMEVIDEO
            - HBOMAX
            - MOVISTARPLUS
        directorName:
          type: string
        duration:
          type: integer
          format: int32
        genres:
          type: array
          items:
            $ref: "#/components/schemas/GenreDto"
    DirectorDto:
      type: object
