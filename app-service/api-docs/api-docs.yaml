          type: integer
          format: int64
        directorName:
          type: string
        directorBirthDate:
          type: string
    ListCreateRequest:
      type: object
      properties:
        listName:
          type: string
        type:
          type: string
    SignUpRequest:
      type: object
      properties:
        accountName:
          type: string
        accountEmail:
          type: string
        accountPassword:
          type: string
        confirmPassword:
          type: string
        accountBirthDate:
          type: string
          format: date
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        accountname:
          type: string
        password:
          type: string
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
