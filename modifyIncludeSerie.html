<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Peliculas</title>
    <!-- Libraries-->
    <!--Bootstrap Librarie-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Our CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<!-- Navbar -->

<body class="primary principal">
    <div class="header">
        <div class="icon">
            <a class="navbar-brand" href="#">
                <img src="images/logo.png" width="100" height="100">
            </a>
        </div>
        <div class="menus">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <div class="collapse navbar-collapse" id="navbarNavDropdown">
                        <ul class="nav nav-pills">
                            <li class="nav-item">
                                <a class="nav-link" href="principal.html">Peliculas</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="series.html">Series</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Listas</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
        <div class="search">
            <div class="input-group mb-3">
                <button class="btn btn-outline-primary" type="submit">
                    <i class="bi bi-search"></i>
                </button>
                <input type="text" class="form-control" placeholder="Buscar" aria-label="Buscar">
            </div>
        </div>
        <div class="profile">
            <a href="#">
                <img src="images/perfilNoReg.jpg" class="rounded-circle" width="50" height="50">
            </a>
        </div>
    </div>
    <!-- Page content -->
    <div class="container-administer">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-9 administer-movie">
                <div class="card p-4 bg-secondary text-white rounded-">
                    <h1 class="mb-4 text-center">Añadir/Modificar Serie</h1>
                    <!-- Imagen clicable -->
                    <div class="text-center mb-2">
                        <img id="posterPreview" src="images/administradorImagenFondoPelicula.webp" alt="Seleccionar imagen" class="border" style="width: 200px; height: 200px; object-fit: cover; cursor: pointer;">
                        <p class="mt-2 text-white-50">Pulsa la imagen para subir la portada de la serie</p>
                    </div>

                    <!-- Input file oculto -->
                    <input id="posterInput" type="file" accept="image/*" class="d-none">

                    <form>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="titleInput" placeholder="Título de la película">
                            <label for="titleInput" class="text-dark">Título de la serie</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="directorInput" placeholder="Director">
                            <label for="directorInput" class="text-dark administer-form">Director</label>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="form-floating">
                                    <input type="number" class="form-control" id="yearInput"
                                        placeholder="Año de lanzamiento">
                                    <label for="yearInput" class="text-dark administer-form">Año de
                                        lanzamiento</label>
                                </div>
                            </div>
                            <div class="col">
                                <div class="form-floating mb-3">
                                    <input type="number" class="form-control" id="seasonInput"
                                        placeholder="Número de temporadas">
                                    <label for="seasonInput" class="text-dark administer-form">Número de
                                        temporadas</label>
                                </div>
                            </div>
                            <div class="col">
                                <div class="form-floating mb-3">
                                    <input type="number" class="form-control" id="durationInput"
                                        placeholder="Duración (minutos)">
                                    <label for="durationInput" class="text-dark administer-form">Duración
                                        (minutos)</label>
                                </div>
                            </div>
                        </div>
                        <div class="genero-field" id="generosContainer">
                            <div class="genero-extra">
                                <div class="form-floating mb-1">
                                    <input type="text" class="form-control" name="genres[]" placeholder="Género">
                                    <label class="text-dark administer-form">Género</label>
                                </div>
                            </div>
                            <div class="double-row">
                                <button type="button" class="btn btn-primary mb-2 mt-1" id="addGenero">Añadir género</button>
                                <button type="button" class="btn btn-primary mb-2 mt-1" id="removeGenero">Eliminar género</button>
                            </div>
                        </div>
                        <div class="platform-field" id="platformsContainer">
                            <div class="platform-extra">
                                <div class="form-floating mb-1">
                                    <input type="text" class="form-control" name="platforms[]" placeholder="Plataformas disponibles">
                                    <label class="text-dark administer-form">Plataformas disponibles</label>
                                </div>
                            </div>
                            <div class="double-row">
                                <button type="button" class="btn btn-primary mb-2 mt-1" id="addPlatform">Añadir plataforma</button>
                                <button type="button" class="btn btn-primary mb-2 mt-1" id="removePlatform">Eliminar plataforma</button>
                            </div>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea type="text" class="form-control" id="sinopsisInput" placeholder="Sinopsis"
                                style="height: 100px"></textarea>
                            <label for="sinopsisInput" class="text-dark">Sinopsis</label>
                        </div>
                        <input class="btn btn-primary w-100 py-2" type="submit" value="Añadir Película">
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer py-3">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
            <li class="nav-item">
                <a href="principal.html" class="nav-link px-2">Inicio</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2">Política de Cookies</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2">Aviso Legal</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2">FAQs</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2">Sobre Nosotros</a>
            </li>
        </ul>

        <div class="d-flex justify-content-between">
            <p class="text-center">&copy; 2025 Company, Inc</p>
            <div class="d-flex justify-content-between gap-3">
                <a href="#">
                    <img src="images/logoInsta.webp" class="rounded-circle" width="50" height="50">
                </a>
                <a href="#">
                    <img src="images/logoX.webp" class="rounded-circle" width="50" height="50">
                </a>
            </div>
        </div>
    </footer>
    <script src="js/palomix-admin.js"></script>
    <script src="js/genres.js"></script>
    <script src="js/platforms.js"></script>
</body>

</html>
