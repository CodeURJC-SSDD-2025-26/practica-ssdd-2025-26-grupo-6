services:
  db:
    image: mysql:9.6 
    container_name: mysql-db
    healthcheck:      
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - MYSQL_ROOT_PASSWORD=palomix1234
      - MYSQL_DATABASE=palomixddbb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  app-service:
    image: matiasmaccarrone/app-service:latest
    container_name: app-server
    depends_on:
      db:
        condition: service_healthy  
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/palomixddbb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=palomix1234
    ports:
      - "8443:8443"
    restart: on-failure

  utility-service:
    image: matiasmaccarrone/utility-service:latest
    container_name: utility-server
    depends_on:
      - app-service
    ports:
      - "8081:8081"

volumes:
    db_data: