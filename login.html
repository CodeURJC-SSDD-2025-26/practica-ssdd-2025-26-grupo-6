<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Palomix" />
    <meta name="author" content="Grupo 6" />
    <title>Palomix - Peliculas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">


</head>

<body class="primary">

    <div class="container-login">
        <div class="row w-100 align-items-center">
            <div class="col-md-6 text-center">
                <img class="mb-4 img-fluid" src="images/logo.png" alt="Logo Palomix" width="90%" height="90%" />
            </div>

            <div class="col-md-5 margin-1">
                <div class="card p-4 bg-dark text-white rounded-4">
                    <form>
                        <h1 class="h3 mb-3 text-center">Iniciar Sesión</h1>

                        <div class="form-floating mb-3" id="fEmail">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com"
                                required />
                            <label for="floatingInput" class="text-dark">Correo Electrónico</label>
                        </div>

                        <div class="form-floating mb-3" id="fPass">
                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                            <label for="floatingPassword" class="text-dark">Contraseña</label>
                        </div>

                        <div class="container-sm">
                            <div class="row my-3">
                                <div class="col">
                                    <div class="form-check text-start">
                                        <input class="form-check-input" type="checkbox" value="remember-me"
                                            id="checkDefault">
                                        <label class="form-check-label" for="checkDefault">Recordarme</label>
                                    </div>
                                </div>
                                <div class="col offset-sm-3">
                                    <a class="btn-invisible text-decoration-underline bg-none" type="button"
                                        id="resetPass" data-bs-toggle="modal" data-bs-target="#modalRecuperar">
                                        <h6>Me olvidé la contraseña</h6>
                                    </a>
                                </div>
                            </div>
                            <div class="row my-3">
                                <div class="col"><a href="signUp.html">
                                        <h6>Crear Cuenta</h6>
                                    </a></div>
                                <div class="col offset-sm-3"><a href="principal.html">
                                        <h6> No quiero iniciar sesión</h6>
                                    </a></div>
                            </div>
                        </div>
                        <button class="btn-primary w-100 py-2" id="loginButton" type="button">Acceder</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="modal" tabindex="-1" id="modalRecuperar">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reiniciar Contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Introduce tu correo electrónico para enviar el código de recuperación.</p>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
                        <label for="floatingInput" class="text-dark">Correo Electrónico</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary">Enviar correo</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
            <li class="nav-item">
                <a href="principal.html" class="nav-link px-2">Inicio</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2">Política de Cookies</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2">Aviso Legal</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2">FAQs</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link px-2">Sobre Nosotros</a>
            </li>
        </ul>

        <div class="d-flex justify-content-between">
            <p class="text-center">&copy; 2025 Company, Inc</p>
            <div class="d-flex justify-content-between gap-3">
                <a href="#">
                    <img src="images/logoInsta.webp" class="rounded-circle" width="50" height="50">
                </a>
                <a href="#">
                    <img src="images/logoX.webp" class="rounded-circle" width="50" height="50">
                </a>
            </div>
        </div>
    </footer>
    <!-- Scripts -->
    <script src="js/javaScript.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
