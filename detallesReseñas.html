<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Palomix" />
        <meta name="author" content="Grupo 6" />
        <title>Palomix - Peliculas</title>
        <!-- Libraries-->
         <!--Bootstrap Librarie-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <!-- Our CSS -->
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body class="primary principal">
        <div class="header">
            <div class="icon">
                <a class="navbar-brand" href="#">
                    <img src="images/logo.png" width="100" height="100">
                </a>
            </div> 
            <div class="menus">
                <nav class="navbar navbar-expand-lg">
                    <div class="container-fluid">
                        <div class="collapse navbar-collapse" id="navbarNavDropdown">
                            <ul class="nav nav-pills">
                                <li class="nav-item">
                                    <a class="nav-link" href="principal.html">Peliculas</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="series.html">Series</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">Listas</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
            <div class="search">
                 <div class="input-group mb-3">
                    <button class="btn btn-outline-primary" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                    <input type="text" class="form-control" placeholder="Buscar" aria-label="Buscar">
                </div>
            </div>
            <div class="profile">
                <a href="perfil.html">
                    <img src="images/perfilNoReg.jpg" class="rounded-circle" width="50" height="50">
                </a>
            </div>
        </div>
        <div class="content">
            <div class="card p-4 profileInfo rounded-4 border-0">
                <h2 class="h3 mb-4 text-center text-white">Avatar</h2>

                <div class="text-center mb-4">
                    <div class="itemProfile1">
                        <img src="images/carteleraEjemploAvatar.webp" alt="Poster"
                        width="150" height="220"
                        style="border-radius: 8px;"
                        onerror="this.src='https://via.placeholder.com/150x220?text=Pelicula'">
                    </div>
                </div>

                <div class="profileFields">
                    <div class="mb-3 text-center">
                        <label class="small text-uppercase opacity-50 mb-1">Valoración</label>
                        <div class="d-flex justify-content-center gap-1" id="stars">
                            <i class="bi bi-star star" data-value="1"></i>
                            <i class="bi bi-star star" data-value="2"></i>
                            <i class="bi bi-star star" data-value="3"></i>
                            <i class="bi bi-star star" data-value="4"></i>
                            <i class="bi bi-star star" data-value="5"></i>
                            <input type="hidden" id="rating" name="rating">
                        </div>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="small text-uppercase opacity-50 mb-1">Reseña</label>
                        <div class="itemProfile4">
                            <textarea class="form-control bg-transparent text-white border-0"
                            placeholder="Escribe tu reseña aquí..."
                            rows="4"
                            style="resize: none;"></textarea>
                        </div>
                    </div>

                    <div class="itemProfile3 mt-4">
                        <button type="submit" class="btn  w-100">Guardar Reseña</button>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer py-3">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item">
                    <a href="principal.html" class="nav-link px-2">Inicio</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2">Política de Cookies</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2">Aviso Legal</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2">FAQs</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2">Sobre Nosotros</a>
                </li>
            </ul>

            
            <div class="d-flex justify-content-between">
                <p class="text-center">&copy; 2025 Company, Inc</p>
                <div class="d-flex justify-content-between gap-3">
                    <a href="#">
                        <img src="images/logoInsta.webp" class="rounded-circle" width="50" height="50">
                    </a>
                    <a href="#">
                        <img src="images/logoX.webp" class="rounded-circle" width="50" height="50">
                    </a>
                </div>
            </div>
        </footer>
        <script src="js/stars.js"></script>
    </body>
</html>
